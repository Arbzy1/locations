# Forkers: change `name`, BETTER_AUTH_URL, and the custom domain route below
# so you deploy YOUR worker — not locations.aden.website.
name = "locations"
main = "apps/api/src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true
account_id = "8507815ae44383c8d60535ea462f5124"

[assets]
directory = "apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
BETTER_AUTH_URL = "https://locations.aden.website"
DISABLE_SIGNUP = "false"
CSP_ENFORCE = "false"
# MAP_TILE_DARK_URL = "https://..."
# MAP_TILE_LIGHT_URL = "https://..."
# MAP_TILE_ATTR = "&copy; OSM &copy; your tile vendor"
# OSRM_BASE = "https://your-osrm.example"
# GEOCODE_BASE = "https://your-geocoder.example"

# Secrets (set via wrangler secret put):
#   DATABASE_URL
#   BETTER_AUTH_SECRET
#   RESEND_API_KEY
#   STRIPE_SECRET_KEY
#   STRIPE_WEBHOOK_SECRET
#   DEMO_EMAIL
#   DEMO_PASSWORD

# Optional queue (create with: wrangler queues create locations-imports)
# [[queues.producers]]
# binding = "IMPORT_QUEUE"
# queue = "locations-imports"
# [[queues.consumers]]
# queue = "locations-imports"
# max_batch_size = 1

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "locations-uploads"
preview_bucket_name = "locations-uploads-preview"

# Owner demo domain — remove or replace when deploying your own fork
[[routes]]
pattern = "locations.aden.website"
custom_domain = true
