# Top-level config is for `wrangler dev` only. Name is locations-dev so a
# bare `wrangler deploy` cannot overwrite the production Worker (`locations`).
# Deploy with: npm run deploy:staging | npm run deploy:prod
name = "locations-dev"
main = "apps/api/src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true
account_id = "8507815ae44383c8d60535ea462f5124"

[assets]
directory = "apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[observability]
enabled = true

[triggers]
crons = ["0 8 1 * *"]

[secrets]
required = ["DATABASE_URL", "BETTER_AUTH_SECRET"]

[vars]
BETTER_AUTH_URL = "http://localhost:8787"
DISABLE_SIGNUP = "false"
CSP_ENFORCE = "false"
GLOBE_ENABLED = "true"
LANDING_ENABLED = "true"
DEMO_TOUR = "true"

# Local / preview R2. Staging and production override this binding.
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "locations-uploads-preview"
preview_bucket_name = "locations-uploads-preview"

# ----- staging -----
[env.staging]
name = "locations-staging"
workers_dev = false
preview_urls = false

[env.staging.secrets]
required = ["DATABASE_URL", "BETTER_AUTH_SECRET"]

[env.staging.vars]
BETTER_AUTH_URL = "https://locations-staging.aden.website"
DISABLE_SIGNUP = "false"
CSP_ENFORCE = "true"
GLOBE_ENABLED = "true"
LANDING_ENABLED = "true"
DEMO_TOUR = "true"

[[env.staging.r2_buckets]]
binding = "UPLOADS"
bucket_name = "locations-uploads-staging"
preview_bucket_name = "locations-uploads-preview"

[[env.staging.routes]]
pattern = "locations-staging.aden.website"
custom_domain = true

[[env.staging.queues.producers]]
binding = "IMPORT_QUEUE"
queue = "locations-imports-staging"

[[env.staging.queues.consumers]]
queue = "locations-imports-staging"
max_batch_size = 1

[env.staging.triggers]
crons = ["0 8 1 * *"]

# ----- production -----
[env.production]
name = "locations"
workers_dev = false
preview_urls = false

[env.production.secrets]
required = ["DATABASE_URL", "BETTER_AUTH_SECRET"]

[env.production.vars]
BETTER_AUTH_URL = "https://locations.aden.website"
DISABLE_SIGNUP = "false"
CSP_ENFORCE = "true"
GLOBE_ENABLED = "true"
LANDING_ENABLED = "true"
DEMO_TOUR = "true"

[[env.production.r2_buckets]]
binding = "UPLOADS"
bucket_name = "locations-uploads"
preview_bucket_name = "locations-uploads-preview"

[[env.production.routes]]
pattern = "locations.aden.website"
custom_domain = true

[[env.production.queues.producers]]
binding = "IMPORT_QUEUE"
queue = "locations-imports"

[[env.production.queues.consumers]]
queue = "locations-imports"
max_batch_size = 1

[env.production.triggers]
crons = ["0 8 1 * *"]
